name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Свой поддомен starline.teyes-sibir.ru (владелец 25.10), корень сайта; пока закрыт от индексации.
      - run: npm run build
        env:
          PUBLIC_BASE: /
          PUBLIC_SITE_URL: https://starline.teyes-sibir.ru
          PUBLIC_NOINDEX: '1'
      - run: echo starline.teyes-sibir.ru > dist/CNAME
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
